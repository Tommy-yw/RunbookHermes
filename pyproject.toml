[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "0.11.0"
description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nous Research" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai>=2.21.0,<3",
  "anthropic>=0.39.0,<1",
  "python-dotenv>=1.2.1,<2",
  "fire>=0.7.1,<1",
  "httpx[socks]>=0.28.1,<1",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",  # CVE-2026-25645
  "cryptography>=42.0.0,<47",
  "jinja2>=3.1.5,<4",
  "pydantic>=2.12.5,<3",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit>=3.0.52,<4",
  # Tools
  "exa-py>=2.9.0,<3",
  "firecrawl-py>=4.16.0,<5",
  "parallel-web>=0.4.2,<1",
  "fal-client>=0.13.1,<1",
  # Text-to-speech (Edge TTS is free, no API key needed)
  "edge-tts>=7.2.7,<8",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]>=2.12.0,<3",  # CVE-2026-32597
]

[project.optional-dependencies]
modal = ["modal>=1.0.0,<2"]
daytona = ["daytona>=0.148.0,<1"]
dev = ["debugpy>=1.8.0,<2", "pytest>=9.0.2,<10", "pytest-asyncio>=1.3.0,<2", "pytest-xdist>=3.0,<4", "mcp>=1.2.0,<2", "ty>=0.0.1a29,<0.0.22", "ruff"]
messaging = ["python-telegram-bot[webhooks]>=22.6,<23", "discord.py[voice]>=2.7.1,<3", "aiohttp>=3.13.3,<4", "slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4", "qrcode>=7.0,<8"]
cron = ["croniter>=6.0.0,<7"]
slack = ["slack-bolt>=1.18.0,<2", "slack-sdk>=3.27.0,<4"]
matrix = ["mautrix[encryption]>=0.20,<1", "Markdown>=3.6,<4", "aiosqlite>=0.20", "asyncpg>=0.29"]
cli = ["simple-term-menu>=1.0,<2"]
tts-premium = ["elevenlabs>=1.0,<2"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24.0,<3",
]
pty = [
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]
honcho = ["honcho-ai>=2.0.1,<3"]
mcp = ["mcp>=1.2.0,<2"]
homeassistant = ["aiohttp>=3.9.0,<4"]
sms = ["aiohttp>=3.9.0,<4"]
acp = ["agent-client-protocol>=0.9.0,<1.0"]
mistral = ["mistralai>=2.3.0,<3"]
bedrock = ["boto3>=1.35.0,<2"]
termux = [
  # Tested Android / Termux path: keeps the core CLI feature-rich while
  # avoiding extras that currently depend on non-Android wheels (notably
  # faster-whisper -> ctranslate2 via the voice extra).
  "python-telegram-bot[webhooks]>=22.6,<23",
  "hermes-agent[cron]",
  "hermes-agent[cli]",
  "hermes-agent[pty]",
  "hermes-agent[mcp]",
  "hermes-agent[honcho]",
  "hermes-agent[acp]",
]
dingtalk = ["dingtalk-stream>=0.20,<1", "alibabacloud-dingtalk>=2.0.0", "qrcode>=7.0,<8"]
feishu = ["lark-oapi>=1.5.3,<2", "qrcode>=7.0,<8"]
web = ["fastapi>=0.104.0,<1", "uvicorn[standard]>=0.24.0,<1"]
runbook-demo = ["fastapi>=0.104.0,<1", "uvicorn[standard]>=0.24.0,<1", "prometheus-client>=0.20.0,<1", "httpx>=0.27.0,<1", "PyMySQL>=1.1.0,<2", "redis>=5.0.0,<6", "opentelemetry-api>=1.25.0,<2", "opentelemetry-sdk>=1.25.0,<2", "opentelemetry-exporter-otlp-proto-http>=1.25.0,<2"]
runbook-postgres = ["psycopg[binary]>=3.1,<4"]
rl = [
  "atroposlib @ git+https://github.com/NousResearch/atropos.git@c20c85256e5a45ad31edf8b7276e9c5ee1995a30",
  "tinker @ git+https://github.com/thinking-machines-lab/tinker.git@30517b667f18a3dfb7ef33fb56cf686d5820ba2b",
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "wandb>=0.15.0,<1",
]
yc-bench = ["yc-bench @ git+https://github.com/collinear-ai/yc-bench.git@bfb0c88062450f46341bd9a5298903fc2e952a5c ; python_version >= '3.12'"]
all = [
  "hermes-agent[modal]",
  "hermes-agent[daytona]",
  "hermes-agent[messaging]",
  # matrix: python-olm (required by matrix-nio[e2e]) is upstream-broken on
  # modern macOS (archived libolm, C++ errors with Clang 21+).  On Linux the
  # [matrix] extra's own marker pulls in the [e2e] variant automatically.
  "hermes-agent[matrix]; sys_platform == 'linux'",
  "hermes-agent[cron]",
  "hermes-agent[cli]",
  "hermes-agent[dev]",
  "hermes-agent[tts-premium]",
  "hermes-agent[slack]",
  "hermes-agent[pty]",
  "hermes-agent[honcho]",
  "hermes-agent[mcp]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[acp]",
  "hermes-agent[voice]",
  "hermes-agent[dingtalk]",
  "hermes-agent[feishu]",
  "hermes-agent[mistral]",
  "hermes-agent[bedrock]",
  "hermes-agent[web]",
]

[project.scripts]
hermes = "hermes_cli.main:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[tool.setuptools]
include-package-data = false
py-modules = ["run_agent", "model_tools", "toolsets", "batch_runner", "trajectory_compressor", "toolset_distributions", "cli", "hermes_constants", "hermes_state", "hermes_time", "hermes_logging", "rl_cli", "utils"]

[tool.setuptools.package-data]
hermes_cli = ["web_dist/**/*"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "hermes_cli", "gateway", "gateway.*", "tui_gateway", "tui_gateway.*", "cron", "acp_adapter", "plugins", "plugins.*", "runbook_hermes", "runbook_hermes.*", "integrations", "integrations.*", "toolservers", "toolservers.*", "apps", "apps.*"]
exclude = ["build", "build.*", "dist", "dist.*", "*.egg-info", "*.egg-info.*", "tinker-atropos", "tinker-atropos.*"]

[tool.setuptools.data-files]
"share/hermes-agent" = ["HERMES_BASELINE.lock", ".env.example", ".env.runbook.example", "README.md", "SECURITY.md"]
"share/hermes-agent/data/runbook_mock/mock_metrics" = ["data/runbook_mock/mock_metrics/*.json"]
"share/hermes-agent/data/runbook_mock/mock_logs" = ["data/runbook_mock/mock_logs/*.json"]
"share/hermes-agent/data/runbook_mock/mock_traces" = ["data/runbook_mock/mock_traces/*.json"]
"share/hermes-agent/data/runbook_mock/mock_deploys" = ["data/runbook_mock/mock_deploys/*.json"]
"share/hermes-agent/data/runbook_mock/scenarios" = ["data/runbook_mock/scenarios/*.json"]
"share/hermes-agent/data/runbook_samples" = ["data/runbook_samples/*.json"]
"share/hermes-agent/data/runbook_benchmark" = ["data/runbook_benchmark/*.json"]
"share/hermes-agent/data/payment_demo" = ["data/payment_demo/*.json"]
"share/hermes-agent/data/payment_demo/runtime" = ["data/payment_demo/runtime/*.txt"]
"share/hermes-agent/demo/payment_system" = ["demo/payment_system/README.md", "demo/payment_system/docker-compose.yml"]
"share/hermes-agent/profiles/runbook-hermes" = ["profiles/runbook-hermes/.env.example", "profiles/runbook-hermes/README.md", "profiles/runbook-hermes/SOUL.md", "profiles/runbook-hermes/config.yaml", "profiles/runbook-hermes/tool_allowlist.yaml"]
"share/hermes-agent/plugins/runbook-hermes" = ["plugins/runbook-hermes/__init__.py", "plugins/runbook-hermes/plugin.yaml"]
"share/hermes-agent/plugins/memory/runbook_hermes" = ["plugins/memory/runbook_hermes/__init__.py", "plugins/memory/runbook_hermes/plugin.yaml", "plugins/memory/runbook_hermes/README.md"]
"share/hermes-agent/skills/runbooks/common-incident-triage" = ["skills/runbooks/common-incident-triage/*.md"]
"share/hermes-agent/skills/runbooks/payment-503-spike" = ["skills/runbooks/payment-503-spike/*.md"]
"share/hermes-agent/web/static" = ["web/static/*.html", "web/static/*.css", "web/static/*.js"]
"share/hermes-agent/docs/runbook-hermes" = ["docs/runbook-hermes/*.md"]
"share/hermes-agent/docs/deployment" = ["docs/deployment/*.md"]
"share/hermes-agent/docs/integrations" = ["docs/integrations/*.md"]
"share/hermes-agent/docs/operations" = ["docs/operations/*.md"]
"share/hermes-agent/docs/architecture" = ["docs/architecture/*.md"]
"share/hermes-agent/docs" = ["docs/*.md"]
"share/hermes-agent/docs/assets" = ["docs/assets/*.png"]
"share/hermes-agent/docs/adr" = ["docs/adr/*.md"]
"share/hermes-agent/docs/migration" = ["docs/migration/*.md"]
"share/hermes-agent/docs/archive" = ["docs/archive/*.md"]
"share/hermes-agent/docs/upstream" = ["docs/upstream/*.md"]
"share/hermes-agent/demo/payment_system/services/payment_service" = ["demo/payment_system/services/payment_service/*"]
"share/hermes-agent/demo/payment_system/services/coupon_service" = ["demo/payment_system/services/coupon_service/*"]
"share/hermes-agent/demo/payment_system/services/order_service" = ["demo/payment_system/services/order_service/*"]
"share/hermes-agent/demo/payment_system/prometheus" = ["demo/payment_system/prometheus/*"]
"share/hermes-agent/demo/payment_system/promtail" = ["demo/payment_system/promtail/*"]
"share/hermes-agent/demo/payment_system/mysql" = ["demo/payment_system/mysql/*"]
"share/hermes-agent/demo/payment_system/scripts" = ["demo/payment_system/scripts/*"]
"share/hermes-agent/demo/payment_system/grafana/provisioning/datasources" = ["demo/payment_system/grafana/provisioning/datasources/*"]
"share/hermes-agent/scripts" = ["scripts/runbook_*.py", "scripts/runbook_*.sh", "scripts/runbook_bootstrap.py", "scripts/_runbook_bootstrap.py"]
"share/hermes-agent/tests/runbook" = ["tests/runbook/*.py"]
"share/hermes-agent/.github/workflows" = [".github/workflows/*.yml", ".github/workflows/*.yaml"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.src]
exclude = ["**"]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
not-iterable = "ignore"

[tool.ruff]
exclude = ["*"]

[tool.uv]
exclude-newer = "7 days"
